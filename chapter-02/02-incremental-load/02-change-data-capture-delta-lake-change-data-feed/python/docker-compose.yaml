name: dedp_ch02_cdc_delta_lake_cdf_reader
services:
  events_table_streaming_reader:
    build: .
    container_name: dedp_test_cdc_delta_lake_cdf_reader
    init: true
    volumes:
      - .:/app/src:ro
      # create_host_path: false fails fast instead of creating a root-owned dataset directory on the host
      - type: bind
        source: /tmp/dedp/ch02/incremental-load/change-data-capture
        target: /tmp/dedp/ch02/incremental-load/change-data-capture
        read_only: true
        bind:
          create_host_path: false
    command:
      - bash
      - -c
      - |
        test -d /tmp/dedp/ch02/incremental-load/change-data-capture/input/date=2023-11-07 \
          || { echo 'Dataset not found; create it first with the ../dataset docker-compose'; exit 1; }
        exec python src/events_table_streaming_reader.py
